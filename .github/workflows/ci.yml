name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  minimal-core:
    name: Minimal core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - run: swift build --disable-default-traits --product Ratatui

  macos-validation:
    name: macOS tests, API, and ecosystem
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"
      - run: swift format lint --strict --recursive Package.swift Sources Tests
      - run: swift test
      - run: Scripts/check-api.sh
      - run: Scripts/test-ecosystem.sh
      - name: Benchmark smoke test
        run: |
          swift run -c release ratatui-benchmark -- --suite all --iterations 10 --json > benchmark.json
          python3 -c 'import json; assert len(json.load(open("benchmark.json"))) >= 20'
